# HTTP - Redirect all traffic to HTTPS (preserving ACME challenges)
server {
    listen 80;
    server_name kidneyvision.publicvm.com 9.205.29.254 localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Secure Production Server
server {
    listen 443 ssl;
    server_name kidneyvision.publicvm.com 9.205.29.254 localhost;
    client_max_body_size 25M;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/kidneyvision.publicvm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kidneyvision.publicvm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://*.supabase.co;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Block access to hidden files (.env, .git, .htaccess, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend API & Auth endpoints (All medical scans and signatures are routed via authenticated /api endpoints)
    location ~ ^/(api|sanctum)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }
}
