version: '3.8'

services:
  # Flask AI Deep Learning Microservice
  ai-service:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.ai-service
    container_name: kidneyvision-ai-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - MODEL_PATH=best_model.keras
      - PORT=5000
    volumes:
      - ./models/production:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Laravel 12 Backend API
  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: kidneyvision-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY:-base64:cK15Y1E4Y00FOGQd3H0Y5B40pZ1vB5h0+H1f1m9X+8M=}
      - APP_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - AI_SERVICE_URL=http://ai-service:5000
    depends_on:
      ai-service:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./backend-laravel/storage:/var/www/html/storage
      - ./backend-laravel/database:/var/www/html/database

  # React 19 Frontend Web Client
  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: kidneyvision-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
